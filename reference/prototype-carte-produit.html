<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Carte produit Spore V2</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=Figtree:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* Idée : un arbre de compétences de jeu vidéo sur fond blanc. Une couleur par famille, des cases « boutons »
   en relief une fois débloquées, un cadenas sur ce qui reste à débloquer, des liaisons qui s'allument.
   Thème clair unique, par choix. */
:root{
  color-scheme:light;
  --bg:#ffffff; --dot:#e6e9ee; --ink:#1b1f2a; --muted:#6b7480; --line:#cfd4dc; --lock:#aeb5c0; --lockbg:#f7f8fa;
  --drift:#e03131; --drift-soft:#ffecec;
  --display:"Chakra Petch","Figtree",system-ui,sans-serif; --font:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);font-size:14px;line-height:1.4;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer;background:none;border:0;padding:0}
:focus-visible{outline:3px solid var(--ink);outline-offset:3px}

#board{position:absolute;inset:0;overflow:hidden;touch-action:none;cursor:grab;
  background-image:radial-gradient(var(--dot) 1.2px,transparent 1.2px);background-size:24px 24px}
#board.drag{cursor:grabbing}
#layer{position:absolute;left:0;top:0;transform-origin:0 0;will-change:transform}
#layer svg.wires{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.ln{fill:none;stroke:var(--line);stroke-width:2;stroke-linecap:round}
.ln.done{stroke:var(--fc);stroke-width:3}
.ln.wip{stroke:var(--fc);stroke-width:3;stroke-dasharray:2 8;animation:flow 1s linear infinite}
.ln.todo,.ln.later,.ln.out{stroke-dasharray:1 7}
@keyframes flow{to{stroke-dashoffset:-10}}

.nd{position:absolute;text-align:left;display:flex;align-items:center;gap:9px;line-height:1.2;transition:transform .12s, box-shadow .12s}
.nd.dim{opacity:.18}
.hex{flex:none;width:30px;height:27px;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);display:grid;place-items:center;background:var(--fc);color:#fff}
.hex svg{width:14px;height:14px}

/* le produit */
.root{width:150px;height:150px;border-radius:50%;background:var(--bg);flex-direction:column;justify-content:center;gap:0;text-align:center;box-shadow:0 5px 0 var(--ink);border:2.5px solid var(--ink)}
.root svg{position:absolute;inset:8px;width:calc(100% - 16px);height:calc(100% - 16px);transform:rotate(-90deg)}
.root em{font-style:normal;font-family:var(--display);font-weight:700;font-size:14px;letter-spacing:.04em;text-transform:uppercase;position:relative}
.root b{font-family:var(--display);font-size:34px;font-weight:700;line-height:1;position:relative}
.root span{font-size:11.5px;color:var(--muted);position:relative}
.root:hover{transform:translateY(-2px);box-shadow:0 7px 0 var(--ink)}

/* une famille */
.fam{background:var(--bg);border:2.5px solid var(--fc);border-radius:16px;box-shadow:0 5px 0 var(--fc);padding:0 12px;gap:10px}
.fam .hex{width:40px;height:36px} .fam .hex svg{width:20px;height:20px}
.fam .tx{display:grid;gap:5px;flex:1;min-width:0}
.fam b{font-family:var(--display);font-size:15px;font-weight:700;line-height:1.1}
.fam .xp{display:flex;align-items:center;gap:7px}
.fam .seg{flex:1;height:8px;border-radius:4px;background:var(--dot);overflow:hidden;display:flex}
.fam .seg u{display:block;height:100%;background:var(--fc)} .fam .seg u+u{background:repeating-linear-gradient(135deg,var(--fc) 0 3px,transparent 3px 6px)}
.fam i{font-style:normal;font-family:var(--display);font-weight:600;font-size:12.5px;color:var(--fc);font-variant-numeric:tabular-nums}
.fam:hover,.fam[aria-pressed="true"]{transform:translateY(-2px);box-shadow:0 7px 0 var(--fc)}

.gp{position:absolute;display:flex;align-items:center;justify-content:center;background:var(--bg);border:2px solid var(--fc);color:var(--fc);border-radius:999px;font-family:var(--display);font-size:11.5px;font-weight:600;text-align:center;line-height:1.1;padding:0 8px}

/* un sujet */
.st>span:last-of-type,.st>span:nth-child(2){display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.st{border-radius:13px;padding:0 10px;font-size:12.5px;font-weight:600;background:var(--ft);border:2px solid var(--fc);box-shadow:0 4px 0 var(--fc)}
.st:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--fc)}
.st[aria-pressed="true"]{transform:translateY(-2px);box-shadow:0 6px 0 var(--fc),0 0 0 4px var(--ft)}
.st.wip{background:var(--bg);animation:pulse 1.8s ease-in-out infinite}
.st.wip .hex{background:var(--bg);box-shadow:none;clip-path:none;width:28px;height:28px;border-radius:50%;border:3px solid var(--ft);border-top-color:var(--fc);animation:spin 1.1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes pulse{50%{box-shadow:0 4px 0 var(--fc),0 0 0 5px var(--ft)}}
.st.todo,.st.later,.st.out{background:var(--lockbg);border:2px dashed var(--lock);box-shadow:none;color:var(--muted);font-weight:500}
.st.todo:hover,.st.later:hover,.st.out:hover{box-shadow:0 3px 0 var(--lock);border-style:solid}
.st.todo .hex{background:var(--lock)}
.st.later,.st.out{opacity:.62} .st.later .hex,.st.out .hex{background:transparent;color:var(--lock);border:0}
.fl{position:absolute;top:-9px;right:-9px;width:20px;height:20px;border-radius:50%;background:var(--drift);color:#fff;font-family:var(--display);font-weight:700;font-size:13px;display:grid;place-items:center;box-shadow:0 0 0 2.5px var(--bg)}

/* habillage */
.top{position:absolute;left:14px;top:12px;right:14px;display:flex;flex-wrap:wrap;gap:8px 10px;align-items:center;justify-content:space-between;pointer-events:none}
.top>*{pointer-events:auto}
.hud{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.chip{background:var(--bg);border:2px solid var(--ink);border-radius:12px;padding:6px 12px;box-shadow:0 3px 0 var(--ink);display:inline-flex;align-items:center;gap:8px;font-weight:600;font-size:13px}
.chip h1{font-family:var(--display);font-size:15px;font-weight:700;margin:0;letter-spacing:.02em}
.chip.k{border-color:var(--line);box-shadow:0 3px 0 var(--line);color:var(--muted);font-weight:500}
.chip.k b{font-family:var(--display);color:var(--ink);font-size:14px}
.lg{width:16px;height:14px;clip-path:polygon(25% 3%,75% 3%,100% 50%,75% 97%,25% 97%,0 50%);background:var(--ink);display:inline-block}
.lg.w{clip-path:none;width:14px;border-radius:50%;background:none;border:3px solid var(--dot);border-top-color:var(--ink)} .lg.t{background:var(--lock)}
.tg{background:var(--bg);border:2px solid var(--drift);color:var(--drift);border-radius:12px;padding:6px 12px;font-weight:700;font-size:13px;display:inline-flex;align-items:center;gap:8px;box-shadow:0 3px 0 var(--drift)}
.tg i{font-style:normal;width:18px;height:18px;border-radius:50%;background:var(--drift);color:#fff;display:grid;place-items:center;font-family:var(--display);font-size:12px}
.tg[aria-pressed="true"]{background:var(--drift);color:#fff;transform:translateY(2px);box-shadow:0 1px 0 #a51111} .tg[aria-pressed="true"] i{background:#fff;color:var(--drift)}
.zoom{position:absolute;left:14px;bottom:16px;display:flex;background:var(--bg);border:2px solid var(--ink);border-radius:12px;overflow:hidden;box-shadow:0 3px 0 var(--ink)}
.zoom button{min-width:40px;height:36px;padding:0 12px;font-family:var(--display);font-weight:700;font-size:14px;border-right:1px solid var(--dot)}
.zoom button:last-child{border-right:0}
.zoom button:hover{background:#f2f4f7}
.hint{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);font-size:12px;color:var(--muted);background:var(--bg);padding:2px 8px;border-radius:6px;white-space:nowrap}

.card{--fc:var(--ink);--ft:#f2f4f7;position:absolute;right:14px;top:66px;width:min(410px,calc(100% - 28px));max-height:calc(100% - 132px);overflow:auto;background:var(--bg);border:2.5px solid var(--fc);border-radius:18px;padding:16px 18px 18px;display:grid;gap:10px;box-shadow:0 6px 0 var(--fc)}
.card[hidden]{display:none}
.card .x{position:absolute;right:8px;top:6px;width:32px;height:32px;font-size:22px;line-height:1;color:var(--muted)}
.card .ey{font-family:var(--display);font-size:12px;color:var(--fc);font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding-right:26px}
.card h2{font-family:var(--display);font-size:20px;font-weight:700;margin:0;padding-right:20px;line-height:1.2}
.tag{display:inline-flex;align-items:center;gap:6px;font-family:var(--display);font-size:12px;font-weight:700;border-radius:999px;padding:2px 11px;background:var(--fc);color:#fff;justify-self:start}
.tag.wip{background:var(--ft);color:var(--fc);border:2px solid var(--fc)} .tag.todo,.tag.out,.tag.later{background:var(--lockbg);color:var(--muted);border:2px dashed var(--lock)}
.card p{margin:0;font-size:14.5px}
.card .dr{background:var(--drift-soft);border-left:3px solid var(--drift);padding:8px 10px;border-radius:6px;font-size:14px}
.card .dr b{color:var(--drift)}
.card .ev{font-size:12.5px;color:var(--muted)}
.card .lb{display:block;font-family:var(--display);font-size:11.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--muted);margin-bottom:2px}
.card summary{cursor:pointer}
.card .tech{border-top:2px dotted var(--dot);padding-top:10px}
.card ul{margin:0;padding:0;list-style:none;display:grid;gap:6px;font-size:13.5px}
.card li button{text-align:left;display:flex;gap:8px;align-items:baseline;width:100%;padding:3px 0}
.card li button:hover{text-decoration:underline}
.card .who{gap:8px} .card .who li{display:grid;grid-template-columns:auto 1fr;gap:8px;align-items:baseline;font-size:13.5px}
.card .who b{font-family:var(--display);font-size:12px;background:var(--ink);color:#fff;border-radius:999px;padding:1px 9px;white-space:nowrap}
.card .who i{font-style:normal;color:var(--muted);font-size:12px;white-space:nowrap}
.card pre{margin:4px 0 8px;white-space:pre-wrap;font:12px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--lockbg);border:1px solid var(--dot);border-radius:10px;padding:10px;max-height:220px;overflow:auto}
.cp{border:2px solid var(--fc);background:var(--fc);color:#fff;border-radius:10px;padding:7px 14px;font-family:var(--display);font-weight:700;font-size:13px;box-shadow:0 3px 0 var(--ink)}
.cp:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
@media (max-width:640px){
  .hint,.chip.k{display:none}
  .card{left:8px;right:8px;top:auto;bottom:64px;width:auto;max-height:50%}
  .top{left:8px;right:8px;top:8px}
}
@media (prefers-reduced-motion:reduce){ .ln.wip,.st.wip,.st.wip .hex{animation:none} .nd{transition:none} }
</style>
</head>
<body>
<div id="board" aria-label="Arbre du produit Spore V2">
  <div id="layer"></div>
</div>

<div class="top">
  <div class="hud">
    <div class="chip"><h1>Carte produit Spore V2</h1></div>
    <div class="chip k"><i class="lg"></i><b id="c1"></b> débloqués</div>
    <div class="chip k"><i class="lg w"></i><b id="c2"></b> en cours</div>
    <div class="chip k"><i class="lg t"></i><b id="c3"></b> à débloquer</div>
  </div>
  <button class="tg" id="dt" aria-pressed="false"><i>!</i><span id="dtl"></span></button>
</div>

<div class="zoom" role="group" aria-label="Zoom">
  <button id="zo" aria-label="Dézoomer">−</button>
  <button id="zi" aria-label="Zoomer">+</button>
  <button id="zf">Tout voir</button>
</div>
<div class="hint">Glissez pour vous déplacer · cliquez sur une case pour le détail</div>

<aside class="card" id="card" hidden aria-live="polite"></aside>

<script>
const DATA = [{"t": "Récupérer les données", "o": "Léo", "d": "Sans les échanges des équipes et sans les chiffres, Spore n'a rien à analyser. L'enjeu : que le client n'ait presque rien à faire.", "groups": [{"t": "Ce que disent les équipes", "nodes": [{"t": "Lire les échanges Slack", "s": "done", "d": "En service. Spore lit les canaux d'équipe, jamais les conversations privées à deux.", "e": "acquisition/slack.py · fusion n° 35", "u": "Les équipes continuent d'écrire dans Slack comme d'habitude : Spore y récupère ce qui se passe sur le terrain, sans rien leur demander.", "h": "Un robot Slack rejoint les canaux publics et lit les messages. Les conversations privées à deux ne sont jamais lues.", "prs": [{"n": 35, "w": "Léo", "d": "2026-11-18", "t": "Connecteur Slack bot-first"}]}, {"t": "Lire les groupes WhatsApp", "s": "done", "d": "En service. Le client dépose un fichier texte, les doublons sont écartés tout seuls.", "e": "acquisition/whatsapp.py · fusion n° 39", "u": "Beaucoup d'équipes de terrain vivent sur WhatsApp. Le client dépose l'export d'un groupe et Spore en tire les faits de la semaine.", "h": "Le client dépose le fichier texte exporté depuis WhatsApp. Les doublons sont écartés et chaque groupe est rattaché à un pôle.", "prs": [{"n": 39, "w": "Léo", "d": "2026-11-18", "t": "Importer les conversations WhatsApp et les lire dans le pipeline"}]}, {"t": "Utile dès le premier jour", "s": "done", "d": "En service pour Slack.", "e": "README, section Reprise et couverture", "u": "Dès le branchement, Spore remonte un mois en arrière : le premier rapport a déjà du contexte.", "h": "À la première collecte Slack, Spore remonte 30 jours en arrière.", "prs": []}, {"t": "Suivre les messages corrigés", "s": "done", "d": "En service.", "e": "acquisition/sync.py · tests de synchronisation", "u": "Si quelqu'un corrige ou supprime un message, Spore suit : il ne garde pas une information que l'équipe a retirée.", "h": "Si quelqu'un corrige ou efface un message, Spore le sait et met ses analyses à jour.", "prs": [{"n": 14, "w": "Léo", "d": "2026-11-13", "t": "Fondations acquisition et core"}]}, {"t": "Savoir ce que Spore n'a pas vu", "s": "done", "d": "En service.", "e": "acquisition/api.py · get_coverage", "u": "Le rapport dit honnêtement quand un canal ou une période lui a échappé, au lieu de conclure sur des informations incomplètes.", "h": "Spore sait quels canaux et quelles périodes il a réellement lus, et le dit dans le rapport quand il y a un trou.", "prs": [{"n": 14, "w": "Léo", "d": "2026-11-13", "t": "Fondations acquisition et core"}]}, {"t": "Effacer les messages après un délai", "s": "done", "d": "En service, avec effacement automatique.", "e": "Fusion n° 38", "g": "Ton brief dit 90 jours. Aujourd'hui les messages sont gardés 180 jours.", "u": "Les échanges des salariés ne sont pas gardés indéfiniment : un argument de confiance pour le client et ses équipes.", "h": "Les messages bruts sont effacés automatiquement après un délai.", "prs": [{"n": 38, "w": "Léo", "d": "2026-11-18", "t": "Conserver les messages 180 jours après leur acquisition"}]}, {"t": "Lire les pièces jointes", "s": "done", "d": "En service pour les PDF et les images joints aux mails.", "e": "acquisition/email_visual.py · fusions n° 81 et 86", "g": "Ton brief dit « texte uniquement ». Aujourd'hui Spore lit aussi les PDF et les images joints aux mails.", "u": "Un bon de livraison ou un planning envoyé en pièce jointe compte autant qu'un message : Spore le lit aussi.", "h": "Les pièces jointes des mails (PDF, images) sont lues par l'IA et versées dans le tri.", "prs": [{"n": 81, "w": "Léo", "d": "2026-11-19", "t": "Lecture visuelle : troncature, plafond de pages et erreurs"}, {"n": 86, "w": "Léo", "d": "2026-11-20", "t": "Lecture des pièces : plafond avant l'appel, erreurs comptées"}]}, {"t": "Ajouter des documents de l'établissement", "s": "done", "d": "En service.", "e": "acquisition/document_import.py · fusion n° 76", "g": "Ton brief dit que le client ne dépose aucun fichier, sauf WhatsApp. Ce dépôt de documents n'y figure pas.", "u": "Le client peut verser un document utile (planning, compte rendu) pour enrichir l'analyse.", "h": "Un établissement peut déposer des documents, que le tri lit comme une source de plus.", "prs": [{"n": 76, "w": "Léo", "d": "2026-11-19", "t": "Import de fichiers par établissement (PDF, Excel, Word)"}]}, {"t": "Mettre Spore en copie des mails", "s": "wip", "d": "Construit, mais pas encore ouvert. Seul l'établissement de test peut l'utiliser.", "e": "Fusions n° 77 et 85 · README, section Réception", "u": "Le client met une adresse Spore en copie de ses mails d'équipe : rien d'autre à installer.", "h": "La réception des mails est codée et fusionnée, mais l'interrupteur est fermé. Seul l'établissement de test peut l'ouvrir, et il manque encore deux réglages chez le prestataire d'envoi.", "prs": [{"n": 77, "w": "Léo", "d": "2026-11-19", "t": "Acquisition e-mail V1 : réception, pièces jointes, espace et console"}, {"n": 85, "w": "Léo", "d": "2026-11-20", "t": "Réception des e-mails Resend"}], "who": [["Léo", "Poser les deux réglages manquants chez le prestataire d'envoi (secret de signature et clé de lecture)."], ["Léo", "Activer la réception sur l'établissement de test et vérifier un mail de bout en bout."]]}, {"t": "Ouvrir la copie des mails à tous", "s": "todo", "d": "À faire une fois la réception validée sur l'établissement de test.", "e": "README, section Réception : seul l'établissement de test peut être activé", "u": "Sans cela, un client qui travaille surtout par mail n'a pas de source d'échanges à brancher.", "h": "Une fois la réception validée sur l'établissement de test, il faut l'ouvrir aux vrais clients : mise en copie ou règle de transfert automatique.", "prs": [], "p": "Tu travailles dans le dépôt spore-v2 (Django : core, acquisition, intelligence, console, espace ; landing en Next.js). Commence par lire AGENTS.md, CONTRIBUTING.md et le README.\n\nObjectif : permettre à l'équipe Spor  ["#e8590c","#fff0e5",'<path d="M4 6h16v12H4zM4 7l8 6 8-6"/>'],
 ["#d6336c","#ffe9f1",'<path d="M4 5h16v14H4zM4 9h16M8 13h5"/>'],
 ["#495057","#eef0f2",'<path d="M5 5h14v5H5zM5 14h14v5H5zM8 7.5h.01M8 16.5h.01"/>'],
 ["#0c8599","#e2f6f9",'<path d="M14 6a4 4 0 00-5 5l-5 5 2 2 5-5a4 4 0 005-5l-2.5 2.5-2-2z"/>'],
 ["#2f9e44","#e7f7eb",'<path d="M4 10v4h3l6 4V6l-6 4zm12-1a4 4 0 010 6"/>']];
const svg=p=>`<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">${p}</svg>`;
const I={done:svg('<path d="M5 12.5l4.5 4.5L19 7.5"/>'),wip:"",todo:svg('<path d="M7 11V8a5 5 0 0110 0v3M6 11h12v9H6z"/>'),later:svg('<circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/>'),out:svg('<path d="M7 17L17 7M9 7h8v8"/>')};

/* géométrie : tout va de gauche à droite. Produit → famille → thème → sujets */
const PER=5, SW=168, SH=58, SX=186, ROWH=74, FGAP=34;
const RX=20, RS=150, TOP=84, TRUNK=RX+RS+30, FX=TRUNK+30, FW=216, FH=74, BUS=FX+FW+22, GX=BUS+20, GW=132, GH=30, STX=GX+GW+28;
let W=0,H=0, sel=null, driftOn=false;

function build(){
  let html="", lines="";
  const g=stat(DATA.flatMap(all)), pct=Math.round(g.done/g.tot*100), C=2*Math.PI*46;
  let y=TOP, lastF=0;
  const rcy=TOP+RS/2;
  html+=`<button class="nd root" data-k="root" style="left:${RX}px;top:${TOP}px"><svg viewBox="0 0 100 100" aria-hidden="true"><circle cx="50" cy="50" r="46" fill="none" stroke="#e6e9ee" stroke-width="7"/><circle cx="50" cy="50" r="46" fill="none" stroke="#1b1f2a" stroke-width="7" stroke-linecap="round" stroke-dasharray="${g.done/g.tot*C} ${C}"/></svg><em>Spore V2</em><b>${pct} %</b><span>${g.done} sur ${g.tot}</span></button>`;
  lines+=`<path class="ln" d="M${RX+RS} ${rcy} H${TRUNK}"/>`;
  y=TOP+(RS-FH)/2;
  DATA.forEach((f,fi)=>{
    const c=stat(all(f)), fy=y, fcy=fy+FH/2, [fc,ft,ic]=FAM[fi], sty=`--fc:${fc};--ft:${ft}`;
    lines+=`<g style="${sty}">`+(fi===0?`<path class="ln" d="M${TRUNK} ${fcy} H${FX}"/>`:`<path class="ln" d="M${TRUNK} ${fcy-12} Q${TRUNK} ${fcy} ${TRUNK+12} ${fcy} H${FX}"/>`);
    html+=`<button class="nd fam${driftOn&&!c.drift?" dim":""}" data-k="f${fi}" aria-pressed="${sel==="f"+fi}" style="${sty};left:${FX}px;top:${fy}px;width:${FW}px;height:${FH}px">
      <span class="hex">${svg(ic)}</span><span class="tx"><b>${esc(f.t)}</b><span class="xp"><span class="seg"><u style="width:${c.done/c.tot*100}%"></u><u style="width:${c.wip/c.tot*100}%"></u></span><i>${c.done}/${c.tot}</i></span></span>${c.drift?`<span class="fl">${c.drift}</span>`:""}</button>`;
    let gy=fy+(FH-SH)/2, lastG=fcy;
    f.groups.forEach((gr,gi)=>{
      const steps=gr.nodes.map((n,i)=>({...n,i})).sort((a,z)=>ORDER[a.s]-ORDER[z.s]);
      const gcy=gy+SH/2, gs=stat(gr.nodes), gcl=gs.done?"done":"";
      lines+=gi===0?`<path class="ln ${gcl}" d="M${FX+FW} ${fcy} H${GX}"/>`:`<path class="ln ${gcl}" d="M${BUS} ${gcy-12} Q${BUS} ${gcy} ${BUS+12} ${gcy} H${GX}"/>`;
      lastG=gcy;
      html+=`<span class="gp${driftOn&&!gs.drift?" dim":""}" style="${sty};left:${GX}px;top:${gcy-GH/2}px;width:${GW}px;height:${GH}px">${esc(gr.t)}</span>`;
      steps.forEach((n,k)=>{
        const r=Math.floor(k/PER), col=k%PER, x=STX+col*SX, sy=gy+r*ROWH, cy=sy+SH/2;
        if(col===0){
          if(r===0) lines+=`<path class="ln ${n.s}" d="M${GX+GW} ${gcy} H${x}"/>`;
          else { const ex=GX+GW+14; lines+=`<path class="ln ${n.s}" d="M${ex} ${gcy} V${cy-12} Q${ex} ${cy} ${ex+12} ${cy} H${x}"/>`; }
        } else lines+=`<path class="ln ${n.s}" d="M${x-(SX-SW)} ${cy} H${x}"/>`;
        const key=`s${fi}-${gi}-${n.i}`;
        html+=`<button class="nd st ${n.s}${driftOn&&!n.g?" dim":""}" data-k="${key}" aria-pressed="${sel===key}" aria-label="${esc(n.t)} : ${LABEL[n.s]}" style="${sty};left:${x}px;top:${sy}px;width:${SW}px;height:${SH}px"><span class="hex">${I[n.s]}</span><span>${esc(n.t)}</span>${n.g?'<span class="fl">!</span>':""}</button>`;
      });
      gy+=Math.ceil(steps.length/PER)*ROWH+6;
    });
    if(f.groups.length>1) lines+=`<path class="ln done" d="M${BUS} ${fcy} V${lastG-12}"/>`;
    lines+="</g>";
    lastF=fcy; y=gy-6+FGAP;
  });
  lines=`<path class="ln" d="M${TRUNK} ${rcy} V${lastF-12}"/>`+lines;
  W=STX+PER*SX+4; H=y;
  $("#layer").style.width=W+"px"; $("#layer").style.height=H+"px";
  $("#layer").innerHTML=`<svg class="wires" width="${W}" height="${H}" aria-hidden="true">${lines}</svg>`+html;
  $("#dtl").textContent=`${g.drift} écarts avec le brief`;
  $("#c1").textContent=g.done; $("#c2").textContent=g.wip; $("#c3").textContent=g.todo;
}

/* fiche */
function card(){
  const el=$("#card");
  if(!sel){ el.hidden=true; return; }
  let h='<button class="x" aria-label="Fermer">×</button>';
  if(sel==="root"){
    const g=stat(DATA.flatMap(all));
    h+=`<span class="ey">Le produit</span><h2>Spore V2</h2><p>Vos chiffres expliqués, vos plans d'action trouvés. Spore lit ce que disent les équipes, le croise avec les chiffres et envoie chaque lundi ce qui a bougé, pourquoi, et quoi faire.</p><p class="ev">${g.done} sujets débloqués, ${g.wip} en cours, ${g.todo} à débloquer, ${g.later} prévus après la V2.</p><p class="ev">Carte établie le 23 novembre 2026 à partir du brief et du dépôt spore-v2 (branche principale au 20 novembre). « Débloqué » veut dire construit et testé, pas encore éprouvé chez un vrai client. Les sujets à venir sont déduits de l'écart entre ton brief et ce qui existe.</p>`;
  } else if(sel==="drifts"){
    h+=`<span class="ey">Ce qui existe ne correspond pas à ce que tu as écrit</span><h2>Écarts avec le brief</h2><ul>`;
    DATA.forEach((f,fi)=>f.groups.forEach((gr,gi)=>gr.nodes.forEach((n,ni)=>{ if(n.g) h+=`<li><button data-go="s${fi}-${gi}-${ni}"><span>${esc(f.t)} · <b>${esc(n.t)}</b></span></button></li>`; })));
    h+="</ul>";
  } else if(sel[0]==="f"){
    const fi=+sel.slice(1), f=DATA[fi], c=stat(all(f));
    h+=`<span class="ey">Famille · ${esc(f.o)}</span><h2>${esc(f.t)}</h2><p>${esc(f.d)}</p><p class="ev">${c.done} débloqués, ${c.wip} en cours, ${c.todo} à débloquer.</p><ul>`;
    f.groups.forEach((gr,gi)=>gr.nodes.forEach((n,ni)=>{ if(n.s==="wip"||n.s==="todo") h+=`<li><button data-go="s${fi}-${gi}-${ni}"><span class="tag ${n.s}">${LABEL[n.s]}</span><span>${esc(n.t)}</span></button></li>`; }));
    h+="</ul>";
  } else {
    const [fi,gi,ni]=sel.slice(1).split("-").map(Number), f=DATA[fi], n=f.groups[gi].nodes[ni];
    const whoList=w=>`<ul class="who">${w.map(([p,x])=>`<li><b>${esc(p)}</b><span>${esc(x)}</span></li>`).join("")}</ul>`;
    h+=`<span class="ey">${esc(f.t)} · ${esc(f.groups[gi].t)}</span><h2>${esc(n.t)}</h2><span class="tag ${n.s}">${LABEL[n.s]}</span>
      <div><span class="lb">À quoi ça sert</span><p>${esc(n.u)}</p></div><div><span class="lb">Où on en est</span><p>${esc(n.d)}</p></div>
      ${n.g?`<div class="dr"><b>Écart avec ton brief.</b> ${esc(n.g)}</div>`:""}`;
    if(n.s==="done"){
      h+=`<div class="tech"><span class="lb">Comment ça marche</span><p>${esc(n.h)}</p></div>`;
      h+=`<div class="tech"><span class="lb">Qui l'a fait</span>`+(n.prs.length?`<ul class="who">${n.prs.map(p=>`<li><b>${esc(p.w)}</b><span>${esc(p.t)} <i>n° ${p.n}${p.d?` · fusionné le ${p.d.slice(8)}/${p.d.slice(5,7)}`:""}</i></span></li>`).join("")}</ul>`:`<p>Famille portée par ${esc(f.o)}. Pas de livraison précise identifiée.</p>`)+`</div>`;
      h+=`<details class="ev"><summary>Où regarder dans le dépôt</summary>${esc(n.e)}</details>`;
    } else if(n.s==="wip"){
      h+=`<div class="tech"><span class="lb">Ce qui existe déjà</span><p>${esc(n.h)}</p></div><div class="tech"><span class="lb">Qui doit faire quoi</span>${whoList(n.who)}</div><details class="ev"><summary>Où regarder dans le dépôt</summary>${esc(n.e)}</details>`;
    } else if(n.s==="todo"){
      if(n.note) h+=`<p class="ev">${esc(n.note)}</p>`;
      if(n.who) h+=`<div class="tech"><span class="lb">Qui doit faire quoi avant</span>${whoList(n.who)}</div>`;
      if(n.p) h+=`<div class="tech"><span class="lb">Prompt pour le réaliser, aligné sur le dépôt</span><pre id="pr">${esc(n.p)}</pre><button class="cp" id="cp">Copier le prompt</button></div>`;
    } else h+=`<p class="ev">${esc(n.e)}</p>`;
  }
  const fam=(sel[0]==="f"||sel[0]==="s")&&sel!=="drifts"?FAM[parseInt(sel.slice(1))]:null;
  el.style.setProperty("--fc",fam?fam[0]:"#1b1f2a"); el.style.setProperty("--ft",fam?fam[1]:"#f2f4f7");
  el.innerHTML=h; el.hidden=false;
  el.querySelector(".x").onclick=()=>{sel=null; render();};
  const cp=el.querySelector("#cp"); if(cp) cp.onclick=()=>{const tx=el.querySelector("#pr").textContent; const ok=()=>{cp.textContent="Copié";}; try{navigator.clipboard.writeText(tx).then(ok,()=>sel0());}catch(e){sel0();} function sel0(){const r=document.createRange(); r.selectNodeContents(el.querySelector("#pr")); const s=getSelection(); s.removeAllRanges(); s.addRange(r); cp.textContent="Texte sélectionné : copiez-le";}};
  el.querySelectorAll("[data-go]").forEach(x=>x.onclick=()=>{sel=x.dataset.go; render(); center(sel);});
}

/* déplacement et zoom */
let s=1, tx=0, ty=0;
const board=$("#board"), layer=$("#layer");
const apply=()=>{layer.style.transform=`translate(${tx}px,${ty}px) scale(${s})`;};
function fit(whole){
  const bw=board.clientWidth, bh=board.clientHeight;
  const fw=Math.min(bw/(W+16),1), fa=Math.min(fw,(bh-130)/H);
  s=whole?fa:Math.max(fw,.6);
  tx=Math.max((bw-W*s)/2,8); ty=64-TOP*s+10; apply();
}
function zoomAt(f,cx,cy){ const ns=Math.min(2,Math.max(.3,s*f)); tx=cx-(cx-tx)*ns/s; ty=cy-(cy-ty)*ns/s; s=ns; apply(); }
function center(k){ const el=layer.querySelector(`[data-k="${k}"]`); if(!el) return;
  const x=el.offsetLeft+el.offsetWidth/2, y=el.offsetTop+el.offsetHeight/2;
  tx=board.clientWidth*.4-x*s; ty=board.clientHeight*.45-y*s; apply(); }
const pts=new Map(); let moved=0, pinch=0;
board.addEventListener("pointerdown",e=>{pts.set(e.pointerId,[e.clientX,e.clientY]); moved=0; if(pts.size===2){const v=[...pts.values()]; pinch=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]);}});
board.addEventListener("pointermove",e=>{
  if(!pts.has(e.pointerId)) return; const p=pts.get(e.pointerId), dx=e.clientX-p[0], dy=e.clientY-p[1];
  pts.set(e.pointerId,[e.clientX,e.clientY]);
  if(pts.size===1){ moved+=Math.abs(dx)+Math.abs(dy); if(moved>5){ board.classList.add("drag"); tx+=dx; ty+=dy; apply(); } }
  else if(pts.size===2){ const v=[...pts.values()], d=Math.hypot(v[0][0]-v[1][0],v[0][1]-v[1][1]); if(pinch) zoomAt(d/pinch,(v[0][0]+v[1][0])/2,(v[0][1]+v[1][1])/2); pinch=d; moved=99; }
});
const up=e=>{pts.delete(e.pointerId); board.classList.remove("drag"); if(pts.size<2) pinch=0;};
board.addEventListener("pointerup",up); board.addEventListener("pointercancel",up); board.addEventListener("pointerleave",up);
board.addEventListener("wheel",e=>{e.preventDefault(); if(e.ctrlKey||e.metaKey) zoomAt(Math.exp(-e.deltaY*.01),e.clientX,e.clientY); else {tx-=e.deltaX; ty-=e.deltaY; apply();}},{passive:false});
layer.addEventListener("click",e=>{ const b=e.target.closest("button.nd"); if(!b||moved>5) return; sel=sel===b.dataset.k?null:b.dataset.k; render(); });
$("#zi").onclick=()=>zoomAt(1.2,board.clientWidth/2,board.clientHeight/2);
$("#zo").onclick=()=>zoomAt(1/1.2,board.clientWidth/2,board.clientHeight/2);
$("#zf").onclick=()=>fit(true);
$("#dt").onclick=()=>{driftOn=!driftOn; $("#dt").setAttribute("aria-pressed",driftOn); sel=driftOn?"drifts":null; render();};
function render(){ build(); card(); }
render(); fit(false);
</script>
</body>
</html>
